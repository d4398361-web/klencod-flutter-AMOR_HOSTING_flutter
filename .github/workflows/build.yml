name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android platform
        run: |
          flutter create --platforms=android --project-name amor_hosting --org com.amor.hosting .
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<manifest[^>]*>#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="AMOR HOSTING"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: amor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
